# Local, reproducible Clearline stack (synthetic data only).
#   docker compose up -d                 # postgres, migrations, demo seed, api, worker (reads optional .env.local)
#   docker compose run --rm demo         # load the reference dataset and print results
#   native/target/release/clearline --url http://localhost:8080   # desktop client (npm run native:build; tokens in README)
#   docker compose down -v               # stop and delete all data
#
# Secrets: values below are LOCAL DEMO credentials. In any shared environment
# supply DATABASE_URL / POSTGRES_PASSWORD from a secret store (see docs/deployment.md).

x-app: &app
  build:
    context: .
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
  image: clearline:local
  env_file:
    - path: .env.local
      required: false
  environment: &app-env
    DATABASE_URL: postgres://clearline:${POSTGRES_PASSWORD:-clearline-local-only}@db:5432/clearline
    LOG_LEVEL: info
    DB_POOL_SIZE: "10"
    STATEMENT_TIMEOUT_MS: "60000"
    BATCH_TIMEOUT_MS: "600000"
    WORKER_LEASE_SECONDS: "120"
    SHUTDOWN_GRACE_MS: "20000"
    MAX_UPLOAD_BYTES: "52428800"
    MAX_ROWS_PER_BATCH: "500000"
    # Query workspace. The application provisions the privilege-less query login with this password.
    QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:-clearline-query-local-only}
    # NL_SQL_PROVIDER: deterministic (default, no network) | anthropic | none. NL_SQL_PROVIDER, ANTHROPIC_API_KEY and
    # ANTHROPIC_WORKSPACE_ID are read from .env.local (git-ignored; see env_file below), never from this file.
    # Saved analytics. The scheduler runs in the worker. Email is written to files in the worker
    # container (no mail server needed for the demo); use EMAIL_PROVIDER=smtp with SMTP_URL for real mail.
    EMAIL_PROVIDER: ${EMAIL_PROVIDER:-file}
    EMAIL_OUTBOX_DIR: /tmp/clearline-outbox
    SMTP_URL: ${SMTP_URL:-}
    PUBLIC_URL: http://localhost:${API_HOST_PORT:-8080}
    # The sign-in page offers the seeded cl_dev_* tokens only where this is true (this local demo stack). Never set it on a real deployment.
    SHOW_DEMO_TOKENS: "true"
    # Anonymous assistant data questions run only against this tenant, as its least-privileged role (synthetic demo data).
    # Leave unset anywhere real data could exist: unset means anonymous visitors get no data answers.
    ASSISTANT_PUBLIC_DATA_TENANT: ${ASSISTANT_PUBLIC_DATA_TENANT-northwind}
  restart: unless-stopped

services:
  db:
    # PostgreSQL 16 plus the pgvector extension (assistant retrieval index only); built from db/Dockerfile.
    # Override POSTGRES_IMAGE to use a prebuilt image that already ships pgvector.
    build: { context: ./db, dockerfile: Dockerfile }
    image: ${POSTGRES_IMAGE:-clearline-db:local}
    environment:
      POSTGRES_USER: clearline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearline-local-only}
      POSTGRES_DB: clearline
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${DB_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearline -d clearline"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy: { resources: { limits: { cpus: "2", memory: 1g } } }
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["node", "dist/src/cli.js", "migrate"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  seed:
    <<: *app
    # Creates the two demo tenants, their well-known demo tokens and v1 contracts.
    # Refuses to run when NODE_ENV=production, so it is explicitly development here.
    environment: { <<: *app-env, NODE_ENV: development }
    command: ["node", "dist/scripts/seed.js"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: "no"

  index:
    <<: *app
    # Builds or refreshes the assistant's retrieval index (approved documents and content). Re-run it after
    # documentation changes: docker compose run --rm index. A failure here does not stop the stack; the
    # assistant then reports that retrieval is unavailable instead of guessing.
    command: ["node", "dist/src/cli.js", "assistant-index"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: "no"

  api:
    <<: *app
    command: ["node", "dist/src/main.js"]
    ports: ["127.0.0.1:${API_HOST_PORT:-8080}:8080"]
    depends_on:
      seed: { condition: service_completed_successfully }
      index: { condition: service_completed_successfully, required: false }
    stop_grace_period: 30s
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }

  worker:
    <<: *app
    command: ["node", "dist/src/worker-main.js"]
    # Healthy when this container's worker has a recent heartbeat in the database (or is mid-batch).
    healthcheck:
      test: ["CMD", "node", "dist/src/worker-health.js"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    depends_on: { seed: { condition: service_completed_successfully } }
    stop_grace_period: 30s
    deploy: { replicas: 1, resources: { limits: { cpus: "1", memory: 768m } } }

  demo:
    <<: *app
    profiles: [demo]
    environment: { <<: *app-env, CLEARLINE_URL: "http://api:8080", PUBLIC_URL: "http://localhost:${API_HOST_PORT:-8080}" }
    command: ["node", "dist/scripts/demo.js"]
    depends_on: { api: { condition: service_healthy } }
    restart: "no"

volumes:
  pgdata:
