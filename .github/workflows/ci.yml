name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck, audit, unit, integration, scenarios A–J, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      PGHOST_URL: postgres://clearline:clearline@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm --prefix dashboard ci
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency audit (production dependencies, high and above fail the build)
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix dashboard audit --omit=dev --audit-level=high
      - name: Create application database role
        run: psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE clearline LOGIN PASSWORD 'clearline' CREATEROLE"
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Demonstration scenarios A–J
        run: npm run test:scenarios
      - name: Build dashboard
        run: npm --prefix dashboard run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end dashboard test
        run: npm run test:e2e
      - name: Small benchmark (smoke; numbers from CI runners are not published)
        run: npm run benchmark
        env:
          BENCH_SIZES: "2000"
          BENCH_WORKERS: "2"
          BENCH_PARALLEL_BATCHES: "4"
          BENCH_PARALLEL_ROWS: "1000"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact --verbose

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  container:
    name: image build and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait api
      - name: Run the demonstration against the stack
        run: docker compose --profile demo run --rm demo
      - name: Graceful shutdown
        run: |
          docker compose stop worker api
          docker compose ps -a
          test "$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq worker))" = "0"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - run: docker compose down -v
