# Clearline native client (Rust + GPUI). See native/README.md.
[workspace]
resolver = "2"
members = ["crates/clearline-client", "crates/clearline-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.release]
debug = "line-tables-only"
